name: Recall digest

# Collect FDA dietary-supplement recalls every day; every Monday, render the
# previous Mon–Sun week's digest and open a draft PR for review.
#
# Nothing here touches main: a push to main deploys production, and a recall
# post needs a person and Laurie's sign-off first. Collected history lives on
# automation/recall-history (always main + one data commit); the weekly PR
# carries the draft, its review sidecar and the history up to that run.
# Merging the PR is a human step. See skills/pg-blog-mdx/references/recall-digest.md.

on:
  schedule:
    - cron: "0 14 * * *" # daily ~10:00 ET: collect only
    - cron: "0 15 * * 1" # Monday ~11:00 ET: collect, render last week, open draft PR
  workflow_dispatch:
    inputs:
      mode:
        description: "collect = update history only; weekly = render last week and open a PR"
        type: choice
        options: [collect, weekly]
        default: collect

# Daily and weekly runs both write the history branch; never interleave them.
concurrency:
  group: recall-digest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  recalls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HISTORY_BRANCH: automation/recall-history
      MODE: ${{ github.event.schedule == '0 15 * * 1' && 'weekly' || inputs.mode || 'collect' }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Recall tests
        run: pnpm test:recalls

      # The history branch holds every collection since main last merged a
      # weekly PR, so it is the newest copy; the script merges into it.
      - name: Restore collected history
        run: |
          git config user.name "pharmaguide-recalls[bot]"
          git config user.email "recalls-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$HISTORY_BRANCH" >/dev/null; then
            git fetch origin "$HISTORY_BRANCH"
            git show "origin/$HISTORY_BRANCH:content/recalls/history.json" > content/recalls/history.json
          fi

      # Exit 3 = a source failed or a record may be a supplement and needs a
      # person to classify it (pnpm recalls:digest --classify … --by …). History and the draft are still written
      # (the draft says coverage is incomplete); the job fails at the end so
      # the gap is visible. It never turns into "no recalls this week".
      - name: Collect (and render on Mondays)
        id: run
        run: |
          set +e
          if [ "$MODE" = "weekly" ]; then
            pnpm --silent recalls:digest | tee digest.log
          else
            pnpm --silent recalls:digest --collect-only | tee digest.log
          fi
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          slug=$(sed -n 's#^Draft:  content/blog/\.drafts/\(.*\)\.mdx$#\1#p' digest.log)
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 3 ]

      - name: Save history branch
        run: |
          git add content/recalls/history.json
          git commit -m "recalls: collected history $(date -u +%F)" || true
          git push --force origin "HEAD:refs/heads/$HISTORY_BRANCH"

      - name: Validate draft
        if: env.MODE == 'weekly' && steps.run.outputs.slug != ''
        id: validate
        run: |
          set +e
          node scripts/validate-blog.mjs ".drafts/${{ steps.run.outputs.slug }}" 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee validate.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open weekly draft PR
        if: env.MODE == 'weekly' && steps.run.outputs.slug != ''
        run: |
          slug="${{ steps.run.outputs.slug }}"
          branch="recalls/$slug"
          git checkout -B "$branch"
          git add content/recalls/history.json "content/blog/.drafts/$slug.mdx" "content/blog/.review/$slug.review.md"
          git commit -m "recalls: draft digest $slug" || true
          git push --force origin "HEAD:refs/heads/$branch"

          coverage=$([ "${{ steps.run.outputs.code }}" = 0 ] && echo "complete" || echo "INCOMPLETE — a source failed or records need classifying; see the log and the review sidecar")
          validation=$([ "${{ steps.validate.outputs.code }}" = 0 ] && echo "passed" || echo "FAILED")
          title="Recall digest: $slug$([ "${{ steps.run.outputs.code }}" = 0 ] || echo ' (coverage incomplete)')"
          {
            echo "Automated weekly draft. **Do not merge until a person has checked it against the FDA notices and Laurie has signed off.**"
            echo
            echo "- Coverage: $coverage"
            echo "- Validator: $validation"
            echo "- Draft: \`content/blog/.drafts/$slug.mdx\` (not loaded by the site until moved to \`content/blog/\`)"
            echo "- Review checklist: \`content/blog/.review/$slug.review.md\`"
            echo
            echo "To publish: check each entry against its official notice and classify any unresolved records (review sidecar). After Laurie signs off, on this branch run \`pnpm blog:approve $slug --reviewer laurie-pham --date <sign-off date>\`, commit, mark the PR ready and merge."
            echo
            echo '```'
            cat digest.log
            echo '```'
            echo '<details><summary>Validator output</summary>'
            echo
            echo '```'
            cat validate.log
            echo '```'
            echo '</details>'
          } > pr-body.md

          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "$title" --body-file pr-body.md
          elif ! gh pr create --draft --base main --head "$branch" --title "$title" --body-file pr-body.md; then
            # Repo setting "Allow GitHub Actions to create and approve pull
            # requests" is off: leave a one-click link instead.
            compare="https://github.com/${{ github.repository }}/compare/main...$branch?expand=1"
            { echo "Actions can't open pull requests in this repo, so open this week's draft PR by hand: $compare"; echo; cat pr-body.md; } > issue-body.md
            gh issue create --title "$title" --body-file issue-body.md
          fi

      - name: Fail on incomplete coverage
        if: steps.run.outputs.code == '3'
        run: |
          echo "::error::Recall coverage incomplete: a source failed or records need classifying. History and draft were saved and flagged."
          exit 1
