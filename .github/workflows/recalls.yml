name: Recall digest

# Collect FDA dietary-supplement and medication recalls every day, each as its
# own job with its own history and post. The first run after a Mon–Sun week ends
# also renders each digest and opens a PR. If coverage is complete and the checks
# pass, merging that PR publishes the post.
# GitHub can delay or drop scheduled runs, so a later day picks up a missed one.
#
# Nothing here touches main: a push to main deploys production, and a recall
# post needs a person to check it against the FDA notices first. Collected history lives on
# automation/recall-history and automation/medication-recall-history (always
# main + one data commit); the weekly PR carries the draft, its review sidecar
# and that kind's history up to that run.
# Merging the PR is a human step. See skills/pg-blog-mdx/references/recall-digest.md.

on:
  schedule:
    # Off the hour: GitHub's scheduled runs are most delayed at the top of it.
    - cron: "17 14 * * *" # daily
  workflow_dispatch:
    inputs:
      mode:
        description: "collect = update history only; weekly = render last week and open a PR"
        type: choice
        options: [collect, weekly]
        default: collect
      kind:
        description: "which digest to run"
        type: choice
        options: [both, supplement, medication]
        default: both

# Daily and weekly runs both write the history branches; never interleave them.
concurrency:
  group: recall-digest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  recalls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One kind failing must not cancel or block the other.
    strategy:
      fail-fast: false
      matrix:
        kind: ${{ (inputs.kind == 'supplement' || inputs.kind == 'medication') && fromJSON(format('["{0}"]', inputs.kind)) || fromJSON('["supplement","medication"]') }}
    env:
      KIND: ${{ matrix.kind }}
      HISTORY_BRANCH: ${{ matrix.kind == 'medication' && 'automation/medication-recall-history' || 'automation/recall-history' }}
      HISTORY_FILE: ${{ matrix.kind == 'medication' && 'content/recalls/medication-history.json' || 'content/recalls/history.json' }}
      OPENFDA_API_KEY: ${{ secrets.OPENFDA_API_KEY }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Recall tests
        run: pnpm test:recalls

      # A hand-started run does what it was asked. A scheduled run renders the
      # last finished week until it has a post, PR or issue, open or closed, so
      # a run that died after pushing its branch still gets a review item. A
      # rejected draft stays rejected, and reruns keep reviewers' commits.
      - name: Choose mode
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          slug=$(node scripts/recall-digest.mjs --kind "$KIND" --print-slug)
          if [ -n "$REQUESTED_MODE" ]; then
            mode="$REQUESTED_MODE"
          elif [ -e "content/blog/$slug.mdx" ] ||
            [ -n "$(gh pr list --head "recalls/$slug" --state all --json number -q '.[].number')" ] ||
            [ -n "$(gh issue list --state all --search "\"Recall digest: $slug\" in:title" --json number -q '.[].number')" ]; then
            mode=collect
          else
            mode=weekly
          fi
          echo "MODE=$mode" >> "$GITHUB_ENV"
          echo "$slug: $mode"

      # Start from main's history (people's --classify decisions arrive there
      # through merged PRs) and merge the automation branch's copy (newer
      # collection) into it, so neither overwrites the other.
      - name: Fetch collected history
        run: |
          git config user.name "pharmaguide-recalls[bot]"
          git config user.email "recalls-bot@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$HISTORY_BRANCH" >/dev/null; then
            git fetch origin "$HISTORY_BRANCH"
            git show "origin/$HISTORY_BRANCH:$HISTORY_FILE" > "$RUNNER_TEMP/automation-history.json" || rm -f "$RUNNER_TEMP/automation-history.json"
          fi

      # Exit 3 = a source failed or a record may be a supplement and needs a
      # person to classify it (pnpm recalls:digest --classify … --by …). History and the draft are still written
      # (the draft says coverage is incomplete); the job fails at the end so
      # the gap is visible. It never turns into "no recalls this week".
      - name: Collect (and render the week)
        id: run
        run: |
          set +e
          if [ "$MODE" = "weekly" ]; then
            pnpm --silent recalls:digest --kind "$KIND" --merge-history "$RUNNER_TEMP/automation-history.json" | tee digest.log
          else
            pnpm --silent recalls:digest --kind "$KIND" --collect-only --merge-history "$RUNNER_TEMP/automation-history.json" | tee digest.log
          fi
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          slug=$(sed -n 's#^Draft:  content/blog/\.drafts/\(.*\)\.mdx$#\1#p' digest.log)
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          [ "$code" = 0 ] || [ "$code" = 3 ]

      - name: Save history branch
        run: |
          git add "$HISTORY_FILE"
          git commit -m "recalls: collected $KIND history $(date -u +%F)" || true
          git push --force origin "HEAD:refs/heads/$HISTORY_BRANCH"

      - name: Validate draft
        if: env.MODE == 'weekly' && steps.run.outputs.slug != ''
        id: validate
        run: |
          set +e
          node scripts/validate-blog.mjs ".drafts/${{ steps.run.outputs.slug }}" 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee validate.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # blog:approve runs publish-check and rolls back on failure, so anything
      # short of a clean week stays a draft for a person to finish.
      - name: Prepare post
        if: env.MODE == 'weekly' && steps.run.outputs.slug != '' && steps.run.outputs.code == '0' && steps.validate.outputs.code == '0'
        id: approve
        run: |
          set +e
          pnpm --silent blog:approve "${{ steps.run.outputs.slug }}" 2>&1 | sed 's/\x1b\[[0-9;]*m//g' | tee approve.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open weekly PR
        if: env.MODE == 'weekly' && steps.run.outputs.slug != ''
        run: |
          slug="${{ steps.run.outputs.slug }}"
          branch="recalls/$slug"

          # A rerun must never overwrite review work: if anyone other than
          # this bot has committed to the week's branch, leave it alone.
          others=""
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git fetch origin "$branch"
            others=$(git log "origin/main..origin/$branch" --format='%ae' | grep -v '^recalls-bot@users.noreply.github.com$' || true)
          fi

          if [ -n "$others" ]; then
            echo "::warning::$branch has review commits from someone else; not regenerating it. History was still saved to $HISTORY_BRANCH."
            # A scheduled run only renders a week with no PR or issue, so it
            # still opens one for the reviewed branch.
            [ "$GITHUB_EVENT_NAME" = "schedule" ] || exit 0
          else
            git checkout -B "$branch"
            git add -A "$HISTORY_FILE" content/blog
            git commit -m "recalls: draft digest $slug" || true
            git push --force origin "HEAD:refs/heads/$branch"
          fi

          coverage=$([ "${{ steps.run.outputs.code }}" = 0 ] && echo "complete" || echo "INCOMPLETE — a source failed or records need classifying; see the log and the review sidecar")
          validation=$([ "${{ steps.validate.outputs.code }}" = 0 ] && echo "passed" || echo "FAILED")
          title="Recall digest: $slug$([ "${{ steps.run.outputs.code }}" = 0 ] || echo ' (coverage incomplete)')"
          {
            if [ "${{ steps.approve.outputs.code }}" = 0 ]; then
              echo "Automated weekly digest. **Merging this PR publishes the post.** Check each card against its FDA notice first; the Vercel preview shows the page."
            else
              echo "Automated weekly draft. **Not ready to publish:** finish it on this branch, then run \`pnpm blog:approve $slug\` and merge."
            fi
            echo
            echo "- Coverage: $coverage"
            echo "- Validator: $validation"
            echo "- Publish check: $([ "${{ steps.approve.outputs.code }}" = 0 ] && echo "passed" || echo "not passed or not run")"
            echo "- Review checklist: \`content/blog/.review/$slug.review.md\`"
            echo
            echo '```'
            cat digest.log
            echo '```'
            echo '<details><summary>Validator output</summary>'
            echo
            echo '```'
            cat validate.log
            echo '```'
            echo '</details>'
          } > pr-body.md

          if gh pr view "$branch" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$branch" --title "$title" --body-file pr-body.md
          elif ! gh pr create $([ "${{ steps.approve.outputs.code }}" = 0 ] || echo --draft) --base main --head "$branch" --title "$title" --body-file pr-body.md; then
            # Repo setting "Allow GitHub Actions to create and approve pull
            # requests" is off: leave a one-click link instead.
            compare="https://github.com/${{ github.repository }}/compare/main...$branch?expand=1"
            { echo "Actions can't open pull requests in this repo, so open this week's PR by hand: $compare"; echo; cat pr-body.md; } > issue-body.md
            # A rerun updates the week's open issue instead of opening another.
            issue=$(gh issue list --state open --search "\"Recall digest: $slug\" in:title" --json number,title -q "[.[] | select(.title | startswith(\"Recall digest: $slug\"))][0].number")
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --title "$title" --body-file issue-body.md
            else
              gh issue create --title "$title" --body-file issue-body.md
            fi
          fi

      - name: Fail on incomplete coverage
        if: steps.run.outputs.code == '3'
        run: |
          echo "::error::Recall coverage incomplete: a source failed or records need classifying. History and draft were saved and flagged."
          exit 1
